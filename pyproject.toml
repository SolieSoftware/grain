[project]
name = "grain"
version = "0.1.0"
description = "A declarative ontology layer over relational data."
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "sqlacodegen>=3.0", "ruff>=0.6"]
mcp = ["mcp>=1.0"]

[project.scripts]
grain = "grain.engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grain"]

[tool.ruff]
# The 100-character limit was previously checked with `awk` because ruff was not
# installed, which made it an assertion rather than a constraint. It is enforced
# here so it stays true without anyone remembering to check.
line-length = 100

[tool.ruff.lint]
select = ["F", "E501"]

[tool.ruff.lint.per-file-ignores]
# Generated by sqlacodegen and not hand-maintained: exempt from the line-length
# rule by explicit ruling, so reformatting it can never look like a fix.
"src/grain/domains/chinook/models.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a loaded chinook database"]
addopts = "-ra"
# A cartesian product is a wrong ANSWER, not a style complaint: SQLAlchemy adds
# an unjoined table to FROM and warns, the statement runs, and the rows look
# plausible. Defect C3 shipped four such specs and stayed invisible for the
# whole build because nothing here promoted the warning. It is an error now, so
# a cartesian can never pass a test run again.
filterwarnings = [
    "error::sqlalchemy.exc.SAWarning",
]
