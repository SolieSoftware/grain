# A stock over the chinook database — deliberately its own pack.
#
# Until now a domain pack only DESCRIBED a database it did not own. `stock`
# needs a level column and chinook has none, so `inventory.sql` in this
# directory creates and seeds one. That makes this pack a producer of schema,
# and the design is emphatic that such a thing must be opt-in: the table is
# created by `tools/seed_inventory.py`, never as a side effect of `Grain.load`.
#
# Which is exactly why `Inventory` is NOT declared in the chinook pack. The
# loader refuses an ontology naming a table the database does not have, so
# folding these two declarations into `chinook/ontology.yaml` would make the
# ENTIRE chinook pack — every test, the CLI's default domain, the agent —
# unloadable on any machine where the seed had not been run. A pack whose
# ontology may not describe the database it is pointed at is not a pack.
#
# So the reference to `daily_inventory` lives here, in a pack a caller loads
# only after seeding. It declares no links to chinook's objects: a stock at
# `daily_inventory` grain needs none to be measured, and the traversal case is
# already covered elsewhere.
name: chinook_inventory
description: >
  Units on hand per track, snapshotted daily. Seeded by tools/seed_inventory.py
  into the chinook database; this pack does not load without it.

objects:
  Inventory:
    primary: daily_inventory
    description: >
      Units on hand per track, snapshotted daily. A STOCK: it sums across
      tracks and not across dates.
    properties:
      as_of: {column: daily_inventory.as_of_date, type: date, time_grain: day}
      track: {column: daily_inventory.track_id, type: integer}
      units: {column: daily_inventory.units_on_hand, type: integer, quantity: stock}

  # Track and InvoiceLine are declared AGAIN here, not shared with the chinook
  # pack. `Grain.load` takes one directory and one `ontology.yaml`, so there is
  # no cross-pack link and no merge — but none is needed. A pack may declare
  # any object it wants to link to, and re-declaring these two costs eight
  # lines while keeping the property that made the split necessary: chinook
  # never names `daily_inventory`, so it still loads on an unseeded database.
  #
  # They exist so a stock can be measured ACROSS A FAN. Without them the only
  # queries reaching `daily_inventory` are rooted on it with no traversal, and
  # the interaction between a window and a replicating join — the thing most
  # likely to be wrong — has no measured anchor at all.
  Track:
    primary: track
    title_property: name
    description: A purchasable audio track. Owns the inventory snapshots.
    properties:
      id: {column: track.track_id, type: integer, unique: true}
      name: {column: track.name, type: string}

  InvoiceLine:
    primary: invoice_line
    description: >
      One line of a purchase. Present only to fan the traversal: a track sells
      many times, and each sale replicates that track's inventory rows.
    properties:
      id: {column: invoice_line.invoice_line_id, type: integer, unique: true}

links:
  Inventory_Track:
    from: Inventory
    to: Track
    kind: direct
    on: [{from: daily_inventory.track_id, to: track.track_id}]
    cardinality: many_to_one
    description: The track a snapshot is about. Does not fan out.

  Track_Inventory:
    from: Track
    to: Inventory
    kind: direct
    on: [{from: track.track_id, to: daily_inventory.track_id}]
    cardinality: one_to_many
    inverse_of: Inventory_Track
    description: >
      The snapshots for a track. Fans out — one track, many dates — which is
      precisely what `over_time` collapses.

  Track_InvoiceLines:
    from: Track
    to: InvoiceLine
    kind: direct
    on: [{from: track.track_id, to: invoice_line.track_id}]
    cardinality: one_to_many
    description: >
      The sales of a track. Fans out BEYOND the stock's grain, which is the
      shape that forces aggregate_then_join and so cannot carry a window.

metrics:
  inventory_level:
    grain: daily_inventory
    agg: sum
    value: "daily_inventory.units_on_hand"
    quantity: stock
    over_time: {dimension: as_of, choice: last}
    type: integer
    description: >
      Units on hand at the most recent snapshot. Never summed across dates —
      the window collapses to one instant first.
    ai_context:
      synonyms: [inventory, stock on hand, units available, current inventory]
      instructions: >
        A level, not a total. Asking for it "over January" gives the level at
        the end of January, not the sum of January's daily levels.
