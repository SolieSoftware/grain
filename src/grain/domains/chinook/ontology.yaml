name: chinook
description: A digital music store — artists, tracks, playlists, customers, invoices.

objects:
  Artist:
    primary: artist
    description: >
      A recording artist. Owns albums, and reaches tracks only through them.
    title_property: name
    properties:
      name: {column: artist.name, type: string, nullable: true}

  Album:
    primary: album
    description: >
      A released collection of tracks by one artist.
    title_property: title
    properties:
      title: {column: album.title, type: string}

  Track:
    primary: track
    title_property: name
    description: A purchasable audio track.
    joins:
      # cardinality is required and checked against the database: `genre_id` is
      # genre's primary key, so at most one genre row per track. An object join
      # that fanned would replicate Track's own rows at no declared grain, and
      # is refused at load — model that as a link instead.
      genre:
        to: genre
        kind: left
        cardinality: many_to_one
        on: [{from: track.genre_id, to: genre.genre_id}]
      media_type:
        to: media_type
        kind: left
        cardinality: many_to_one
        on: [{from: track.media_type_id, to: media_type.media_type_id}]
    properties:
      name: {column: track.name, type: string}
      composer: {column: track.composer, type: string, nullable: true}
      duration_ms: {column: track.milliseconds, type: integer}
      unit_price: {column: track.unit_price, type: decimal}
      genre: {column: genre.name, type: string, via: genre, nullable: true}
      media_type: {column: media_type.name, type: string, via: media_type, nullable: true}

  Genre:
    primary: genre
    description: >
      A musical genre. An attribute of a track, not a thing that is sold.
    title_property: name
    properties:
      name: {column: genre.name, type: string, nullable: true}

  MediaType:
    primary: media_type
    description: >
      The encoding format of a track. An attribute, not a thing that is sold.
    title_property: name
    properties:
      name: {column: media_type.name, type: string, nullable: true}

  Playlist:
    primary: playlist
    description: >
      A user-curated collection of tracks. Many-to-many with Track: a track sits on any number of playlists, which is what makes playlist totals overlap.
    title_property: name
    properties:
      # Chinook ships DUPLICATE playlist names ('Music' x2, 'Movies' x2, 'TV
      # Shows' x2, 'Audiobooks' x2), so `name` does not identify a playlist and
      # grouping a non-additive metric by it merged two playlists into one group
      # and double-counted every track they shared (defect C2). Playlist is the
      # only object here that can root a non-additive query — Playlist_Tracks is
      # this pack's only many_to_many — so this is the one place a unique key has
      # to exist for the refusal in grain.analyse to be able to name a legal
      # alternative.
      id: {column: playlist.playlist_id, type: integer, unique: true}
      name: {column: playlist.name, type: string, nullable: true}

  Customer:
    primary: customer
    description: >
      A person who buys tracks. Each has one assigned support rep.
    title_property: last_name
    properties:
      first_name: {column: customer.first_name, type: string}
      last_name: {column: customer.last_name, type: string}
      country: {column: customer.country, type: string, nullable: true}
      city: {column: customer.city, type: string, nullable: true}
      email: {column: customer.email, type: string}

  Invoice:
    primary: invoice
    description: >
      One purchase document, with a header total and many lines.
    properties:
      invoice_date: {column: invoice.invoice_date, type: datetime}
      billing_country: {column: invoice.billing_country, type: string, nullable: true}
      total: {column: invoice.total, type: decimal}

  InvoiceLine:
    primary: invoice_line
    description: >
      One line of a purchase — a single track, its price and quantity. The grain at which revenue is measured.
    properties:
      unit_price: {column: invoice_line.unit_price, type: decimal}
      quantity: {column: invoice_line.quantity, type: integer}

  Employee:
    primary: employee
    description: >
      A member of staff. Self-referential: an employee may report to another.
    title_property: last_name
    properties:
      # Employee is the other object that can root or be traversed into a
      # non-additive query: Employee_Manager is recursive, and traversing a
      # recursive link walks the depth-bounded closure, which is many_to_many.
      # Grouping by an ancestor therefore needs a key that identifies one
      # employee, exactly as grouping by playlist does.
      id: {column: employee.employee_id, type: integer, unique: true}
      first_name: {column: employee.first_name, type: string}
      last_name: {column: employee.last_name, type: string}
      title: {column: employee.title, type: string, nullable: true}

links:
  Artist_Albums:
    from: Artist
    description: >
      The albums by an artist. Fans out.
    to: Album
    kind: direct
    on: [{from: artist.artist_id, to: album.artist_id}]
    cardinality: one_to_many

  Album_Tracks:
    from: Album
    description: >
      The tracks on an album. Fans out — one album, many tracks.
    to: Track
    kind: direct
    on: [{from: album.album_id, to: track.album_id}]
    cardinality: one_to_many

  Track_Album:
    from: Track
    description: >
      The album a track belongs to. Does not fan out.
    to: Album
    kind: direct
    on: [{from: track.album_id, to: album.album_id}]
    cardinality: many_to_one
    inverse_of: Album_Tracks

  Playlist_Tracks:
    from: Playlist
    description: >
      The tracks on a playlist, through playlist_track. Many-to-many: totals across playlists double-count by construction.
    to: Track
    kind: through
    via: playlist_track
    on_from: [{from: playlist.playlist_id, to: playlist_track.playlist_id}]
    on_to: [{from: playlist_track.track_id, to: track.track_id}]
    cardinality: many_to_many

  Track_InvoiceLines:
    from: Track
    description: >
      The sales of a track. Fans out — one track, many lines.
    to: InvoiceLine
    kind: direct
    on: [{from: track.track_id, to: invoice_line.track_id}]
    cardinality: one_to_many

  Customer_Invoices:
    from: Customer
    description: >
      The purchases a customer made. Fans out — one customer, many invoices.
    to: Invoice
    kind: direct
    on: [{from: customer.customer_id, to: invoice.customer_id}]
    cardinality: one_to_many

  Invoice_Lines:
    from: Invoice
    description: >
      The lines of an invoice. Fans out — this is the hop that inflates a naive invoice_total.
    to: InvoiceLine
    kind: direct
    on: [{from: invoice.invoice_id, to: invoice_line.invoice_id}]
    cardinality: one_to_many

  Customer_SupportRep:
    from: Customer
    to: Employee
    kind: direct
    on: [{from: customer.support_rep_id, to: employee.employee_id}]
    cardinality: many_to_one
    description: The sales rep assigned to this customer.

  Employee_Manager:
    from: Employee
    description: >
      Who an employee reports to. Recursive: traversing it walks the whole management chain, not one hop, which makes ancestor groups overlap.
    to: Employee
    kind: recursive
    on: [{from: employee.reports_to, to: employee.employee_id}]
    cardinality: many_to_one
    max_depth: 10

metrics:
  revenue:
    grain: invoice_line
    agg: sum
    value: "invoice_line.unit_price * invoice_line.quantity"
    type: decimal
    description: Money actually taken, at line grain. The correct revenue figure.
    ai_context:
      synonyms: [revenue, sales, turnover, money taken, total sales]
      instructions: >
        Default choice for any revenue question. Prefer this over invoice_total
        unless the question is explicitly about invoice headers.

  invoice_total:
    grain: invoice
    agg: sum
    value: "invoice.total"
    type: decimal
    description: >
      Invoice header totals. Equals revenue only when evaluated at invoice grain.
    ai_context:
      synonyms: [invoice total, billed amount, header total]
      instructions: >
        Only for questions about invoices as documents. Not the default revenue
        metric — see revenue.

  units_sold:
    grain: invoice_line
    agg: sum
    value: "invoice_line.quantity"
    type: integer
    description: >
      Count of items sold, at line grain. A QUANTITY, not money — chinook sells
      one of each track per line, so this is very close to a line count.
    ai_context:
      synonyms: [units sold, quantity sold, items sold, how many sold, volume]
      instructions: >
        Never the answer to "how much did we sell" or any question about value
        — that is revenue. Use this only when the question is explicitly about
        counts of items rather than money.

  track_count:
    grain: track
    agg: count_distinct
    value: "track.track_id"
    type: integer
    description: >
      Distinct tracks in the catalogue reached by the query. A CATALOGUE size,
      not a sales figure — a track counts whether or not it ever sold.
    ai_context:
      synonyms: [tracks, number of tracks, song count, catalogue size]
      instructions: >
        For "how many tracks are on X". If the question is about tracks that
        SOLD, traverse Track_InvoiceLines and use units_sold or revenue instead
        — this metric counts catalogue entries, not sales.

  customer_count:
    grain: customer
    agg: count_distinct
    value: "customer.customer_id"
    type: integer
    description: Distinct customers, at customer grain.
    ai_context:
      synonyms: [customers, number of customers, buyers, how many customers]
      instructions: >
        Safe to combine with any traversal: DISTINCT on the key means a customer
        joined to many invoices is still counted once. For "customers who bought
        X", traverse to X and group as usual.

  employee_count:
    grain: employee
    agg: count_distinct
    value: "employee.employee_id"
    type: integer
    description: Headcount, at employee grain.
    ai_context:
      synonyms: [headcount, number of employees, staff count, how many people]
      instructions: >
        Combine with a traversal of Employee_Manager and a group_by on
        Employee_Manager.id to count everyone reporting up to each manager,
        at any depth.
